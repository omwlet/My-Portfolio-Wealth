name: Keep Render awake

# Render's free tier sleeps after ~15 min idle. This pings the app every
# ~10 min so it stays warm. Runs on GitHub's infrastructure (free).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://portfolio-health.onrender.com/api/health"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$URL" || true)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App is awake."
              exit 0
            fi
            echo "Waiting for cold start..."
            sleep 30
          done
          echo "App did not respond with 200 after retries."
          exit 1
